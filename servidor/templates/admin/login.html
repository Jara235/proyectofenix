<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Centro de Mando Fénix 2.0</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #090d16);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            color: #fff;
        }

        .login-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(139, 92, 246, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.6rem;
            margin: 0 0 8px 0;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-header h1 span {
            color: #8b5cf6;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.88rem;
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .role-hint-card {
            margin-top: 2rem;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px dashed rgba(255,255,255,0.1);
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .role-badge-demo {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h1>🛡️ <span>FÉNIX 2.0</span></h1>
        <p>Centro de Mando Administrativo</p>
    </div>

    {% if error %}
    <div class="alert-error">
        ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="form-group">
            <label for="usuario">👤 Usuario:</label>
            <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Ej. admin o consulta" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">🔑 Contraseña:</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">Ingresar al Sistema ➔</button>
    </form>

    <div class="role-hint-card">
        <div style="font-weight: bold; color: #cbd5e1; margin-bottom: 6px;">👥 Usuarios Disponibles para Demostración:</div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
            <span><span class="role-badge-demo" style="background: rgba(139, 92, 246, 0.2); color: #a78bfa;">ADMIN</span> <b>admin</b></span>
            <code>admin123</code>
        </div>
        <div style="display: flex; justify-content: space-between;">
            <span><span class="role-badge-demo" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8;">CONSULTA</span> <b>consulta</b></span>
            <code>consulta123</code>
        </div>
    </div>
</div>

</body>
</html>
